ss="section-dimension" text-anchor="middle" data-value="6" data-axis="u">6</text><path d="M674,268.3333V429.6667" stroke="#718096" /><path d="M671,268.3333h6" stroke="#718096" /><path d="M671,429.6667h6" stroke="#718096" /><text x="666" y="349" class="section-dimension" text-anchor="middle" data-value="2" data-axis="v" transform="rotate(-90 666 349)">2</text></g><text x="28" y="567" class="section-small">Rayado = material · blanco = vaciado común · color = borde real de un taladro</text><text x="28" y="592" class="section-small">Las guías auxiliares se activan en el visor; no representan aristas. Cotas generales, sin tolerancias de fabricación.</text></svg>
