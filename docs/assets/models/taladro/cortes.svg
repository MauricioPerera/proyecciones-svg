<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 612" width="1240" height="612" class="section-svg" role="img" aria-labelledby="sections-title sections-desc"><title id="sections-title">Bloque con agujero cilíndrico pasante · cortes</title><desc id="sections-desc">Secciones planas reales: material rayado y unión de vaciados en blanco. Los bordes enterrados en otro vaciado se omiten.</desc><metadata>{"method": "analytic plane/cylinder sections; convex half-spaces; union masks", "units": "cm", "source": {"name": "Bloque con agujero cilíndrico pasante", "units": "cm", "type": "block_with_bore", "size": [8, 6, 2], "bore": {"axis": "z", "center": [4, 3], "diameter": 3, "through": true}, "assumptions": ["Ejemplo inventado para probar curvas; medidas en centímetros.", "Taladro vertical centrado, pasante y sin avellanados.", "Círculos y elipses analíticos; la superficie cilíndrica no se aproxima mediante facetas.", "El giro mantiene una elevación de 45 grados."]}, "planes": [{"name": "A–A", "origin": [4.0, 3.0, 1.0], "normal": [0.0, 1.0, 0.0], "horizontal": [-1.0, 0.0, 0.0], "vertical": [0.0, -0.0, 1.0]}, {"name": "B–B", "origin": [4.0, 3.0, 1.0], "normal": [-1.0, 0.0, 0.0], "horizontal": [0.0, -1.0, 0.0], "vertical": [0.0, 0.0, 1.0]}]}</metadata><style>.section-svg text{font-family:system-ui,sans-serif;fill:#1b3048}.section-svg .section-title{font-size:25px;font-weight:700}.section-svg .section-heading{font-size:20px;font-weight:650}.section-svg .section-small,.section-svg .section-origin{font-size:15px}.section-svg .section-dimension{font-size:14px}.section-svg .section-guides{display:none}</style><defs><pattern id="section-hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2L2,-2M0,9L9,0M7,11L11,7" stroke="#93a5b8" stroke-width="0.8" /></pattern><clipPath id="section-0-body"><polygon points="570,288.5 86,288.5 86,409.5 570,409.5" /></clipPath><mask id="section-0-material" maskUnits="userSpaceOnUse" x="0" y="0" width="1240" height="612"><rect x