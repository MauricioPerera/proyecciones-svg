<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 612" width="1240" height="612" class="section-svg" role="img" aria-labelledby="sections-title sections-desc"><title id="sections-title">Cuña · cortes</title><desc id="sections-desc">Secciones planas reales: material rayado y unión de vaciados en blanco. Los bordes enterrados en otro vaciado se omiten.</desc><metadata>{"method": "analytic plane/cylinder sections; convex half-spaces; union masks", "units": "cm", "source": {"name": "Cuña", "units": "cm", "type": "extrusion", "profile": [[0, 0], [6, 0], [6, 3]], "depth": 4, "assumptions": ["Pieza maciza de perfil constante en toda la profundidad."]}, "planes": [{"name": "A–A", "origin": [3.0, 2.0, 1.5], "normal": [0.0, -1.0, 0.0], "horizontal": [1.0, 0.0, -0.0], "vertical": [0.0, 0.0, 1.0]}, {"name": "B–B", "origin": [3.0, 2.0, 1.5], "normal": [1.0, 0.0, 0.0], "horizontal": [0.0, 1.0, 0.0], "vertical": [0.0, 0.0, 1.0]}]}</metadata><style>.section-svg text{font-family:system-ui,sans-serif;fill:#1b3048}.section-svg .section-title{font-size:25px;font-weight:700}.section-svg .section-heading{font-size:20px;font-weight:650}.section-svg .section-small,.section-svg .section-origin{font-size:15px}.section-svg .section-dimension{font-size:14px}.section-svg .section-guides{display:none}</style><defs><pattern id="section-hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2L2,-2M0,9L9,0M7,11L11,7" stroke="#93a5b8" stroke-width="0.8" /></pattern><clipPath id="section-0-body"><polygon points="106,460 550,460 550,238" /></clipPath><mask id="section-0-material" maskUnits="userSpaceOnUse" x="0" y="0" width="1240" height="612"><rect x="0" y="0" width="1240" height="612" fill="white" /></mask><clipPath id="section-1-body"><polygon points="1178,439.75 1178,258.25 694,258.25 694,439.75" /></clipPath><mask id="section-1-material" maskUnits="userSpaceOnUse" x="0" y="0" width="1240" height="612"><rect x="0" y="0" width="1240" height="612" fill="white" /></mask></defs><rect width="100%" height="100%" fill="#f5f8fb" /><text x="24" y="38" class="section-title">Cortes por el interior de la pieza</text><text x="24" y="70" class="section-small">Longitudes reales en el plano del corte · cotas y diámetros en cm</text><g data-section="0"><rect x="24" y="152" width="584" height="364" rx="10" fill="white" stroke="#c7d3df" /><text x="42" y="181" class="section-heading">A–A</text><text x="42" y="205" class="section-origin">Origen (3, 2, 1.5) cm</text><g clip-path="url(#section-0-body)"><g mask="url(#section-0-material)"><polygon points="106,460 550,460 550,238" fill="#e8eef4" /><polygon points="106,460 550,460 550,238" fill="url(#section-hatch)" stroke="#30445b" stroke-width="2" /></g><g class="section-guides" /></g><path d="M106,480H550" stroke="#718096" /><path d="M106,477v6" stroke="#718096" /><path d="M550,477v6" stroke="#718096" /><text x="328" y="499" class="section-dimension" text-anchor="middle" data-value="6" data-axis="u">6</text><path d="M86,238V460" stroke="#718096" /><path d="M83,238h6" stroke="#718096" /><path d="M83,460h6" stroke="#718096" /><text x="78" y="349" class="section-dimension" text-anchor="middle" data-value="3" data-axis="v" transform="rotate(-90 78 349)">3</text></g><g data-section="1"><rect x="632" y="152" width="584" height="364" rx="10" fill="white" stroke="#c7d3df" /><text x="650" y="181" class="section-heading">B–B</text><text x="650" y="205" class="section-origin">Origen (3, 2, 1.5) cm</text><g clip-path="url(#section-1-body)"><g mask="url(#section-1-material)"><polygon points="1178,439.75 1178,258.25 694,258.25 694,439.75" fill="#e8eef4" /><polygon points="1178,439.75 1178,258.25 694,258.25 694,439.75" fill="url(#section-hatch)" stroke="#30445b" stroke-width="2" /></g><g class="section-guides" /></g><path d="M694,459.75H1178" stroke="#718096" /><path d="M694,456.75v6" stroke="#718096" /><path d="M1178,456.75v6" stroke="#718096" /><text x="936" y="478.75" class="section-dimension" text-anchor="middle" data-value="4" data-axis="u">4</text><path d="M674,258.25V439.75" stroke="#718096" /><path d="M671,258.25h6" stroke="#718096" /><path d="M671,439.75h6" stroke="#718096" /><text x="666" y="349" class="section-dimension" text-anchor="middle" data-value="1.5" data-axis="v" transform="rotate(-90 666 349)">1.5</text></g><text x="28" y="567" class="section-small">Rayado = material · blanco = vaciado común · color = borde real de un taladro</text><text x="28" y="592" class="section-small">Las guías auxiliares se activan en el visor; no representan aristas. Cotas generales, sin tolerancias de fabricación.</text></svg>
